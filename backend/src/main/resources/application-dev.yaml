spring:
    datasource:
        url: jdbc:postgresql://${DB_HOST:localhost}:5432/skillswap
        username: skillswap
        password: skillswap
    jpa:
        hibernate:
            ddl-auto: validate
        open-in-view: false

server:
    servlet:
        session:
            # DevTools turns this on, so sessions would survive a backend restart.
            # Off, so dev behaves like prod: a restart logs everyone out.
            persistent: false