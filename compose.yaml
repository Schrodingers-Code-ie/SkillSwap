services:
    postgres:
        image: postgres:17-alpine
        container_name: skillswap-db
        environment:
            POSTGRES_DB: skillswap
            POSTGRES_USER: skillswap
            POSTGRES_PASSWORD: skillswap
        ports:
            - "5432:5432"
        volumes:
            - pgdata:/var/lib/postgresql/data

volumes:
    pgdata:
