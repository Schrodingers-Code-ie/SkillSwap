name: CI

on:
    pull_request:
    push:
        branches: [main]

# Cancel an older run on the same branch when a new commit is pushed
concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

jobs:
    backend:
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: backend
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-java@v4
              with:
                  distribution: temurin
                  java-version: 21
                  cache: maven
            # Docker is preinstalled on ubuntu runners, so Testcontainers works here
            - run: ./mvnw -B verify

    frontend:
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: frontend
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: lts/*
                  cache: npm
                  cache-dependency-path: frontend/package-lock.json
            - run: npm ci
            - run: npm run lint
            - run: npm run build

    # Separate job so a formatting failure doesn't hide test, lint or build results
    format:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-java@v4
              with:
                  distribution: temurin
                  java-version: 21
                  cache: maven
            - uses: actions/setup-node@v4
              with:
                  node-version: lts/*
                  cache: npm
                  cache-dependency-path: frontend/package-lock.json
            # Fix with ./mvnw spotless:apply
            - name: Java format check
              working-directory: backend
              run: ./mvnw -B spotless:check
            # !cancelled() makes the frontend steps run even if the Java check failed, so both results show
            - name: Install frontend dependencies
              if: ${{ !cancelled() }}
              working-directory: frontend
              run: npm ci
            # Fix with npm run format
            - name: Frontend format check
              if: ${{ !cancelled() }}
              working-directory: frontend
              run: npm run format:check
