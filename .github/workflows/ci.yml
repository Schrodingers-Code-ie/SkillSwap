name: CI

on:
    pull_request:
    push:
        branches: [main]

# Cancel an older run on the same branch when a new commit is pushed
concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

jobs:
    backend:
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: backend
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-java@v4
              with:
                  distribution: temurin
                  java-version: 21
                  cache: maven
            # Docker is preinstalled on ubuntu runners, so Testcontainers works here
            - run: ./mvnw -B verify

    frontend:
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: frontend
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: lts/*
                  cache: npm
                  cache-dependency-path: frontend/package-lock.json
            - run: npm ci
            - run: npm run lint
            - run: npm run build

    # Separate job so a formatting failure doesn't hide test, lint or build results
    format:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-java@v4
              with:
                  distribution: temurin
                  java-version: 21
                  cache: maven
            - uses: actions/setup-node@v4
              with:
                  node-version: lts/*
                  cache: npm
                  cache-dependency-path: frontend/package-lock.json
            # Fix with ./mvnw spotless:apply
            - name: Java format check
              working-directory: backend
              run: ./mvnw -B spotless:check
            # !cancelled() makes the frontend steps run even if the Java check failed, so both results show
            - name: Install frontend dependencies
              if: ${{ !cancelled() }}
              working-directory: frontend
              run: npm ci
            # Fix with npm run format
            - name: Frontend format check
              if: ${{ !cancelled() }}
              working-directory: frontend
              run: npm run format:check
    # Builds the Docker image and pushes it to GHCR. Watchtower on the server pulls it within 5 minutes.
    deploy:
        # only after all checks pass
        needs: [backend, frontend, format]
        # only on a push to main (a merged PR), never on PR runs
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        runs-on: ubuntu-latest
        # lets GITHUB_TOKEN push images to the org's GHCR
        permissions:
            contents: read
            packages: write
        steps:
            - uses: actions/checkout@v4
            - uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}
            - uses: docker/build-push-action@v6
              with:
                  context: .
                  push: true
                  tags: ghcr.io/schrodingers-code-ie/skillswap:latest
                  build-args: GIT_SHA=${{ github.sha }}
