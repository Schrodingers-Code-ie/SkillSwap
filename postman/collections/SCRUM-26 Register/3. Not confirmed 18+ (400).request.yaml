$kind: http-request
url: "{{baseUrl}}/api/auth/register"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
        "email": "bob@mail.com",
        "username": "bob",
        "password": "secret123",
        "displayName": "Bob",
        "confirmedAdult": false
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('400 Bad Request', () => pm.response.to.have.status(400));
      pm.test('message', () => pm.expect(pm.response.json().message).to.eql('You must confirm you are 18 or older'));
    language: text/javascript
order: 4000
